name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le job n'a besoin que de lire le contenu (checkout).
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --max-warnings 0 : tout warning ESLint/Prettier fait échouer la CI (garde-fou strict).
      - run: npm run lint -- --max-warnings 0
      - run: npm test
